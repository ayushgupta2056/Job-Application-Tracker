{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Add Application</h1>
                <p class="text-muted mb-0">Save the details of a new job opportunity.</p>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="company" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="company" name="company" value="{{ form_data.company }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="role" class="form-label">Job Role</label>
                            <input type="text" class="form-control" id="role" name="role" value="{{ form_data.role }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                {% for status in statuses %}
                                    <option value="{{ status }}" {% if form_data.status == status %}selected{% endif %}>
                                        {{ status }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="application_date" class="form-label">Application Date</label>
                            <input type="date" class="form-control" id="application_date" name="application_date" value="{{ form_data.application_date }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location" value="{{ form_data.location }}">
                        </div>

                        <div class="col-md-6">
                            <label for="job_link" class="form-label">Job Link</label>
                            <input type="url" class="form-control" id="job_link" name="job_link" value="{{ form_data.job_link }}">
                        </div>

                        <div class="col-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="4">{{ form_data.notes }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
