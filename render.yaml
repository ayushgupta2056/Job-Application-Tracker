# Render Blueprint for the public interview demo.
# Free web services use an ephemeral filesystem: jobs.db is recreated (and
# re-seeded with sample records) whenever the service restarts or redeploys.
services:
  - type: web
    name: job-application-tracker
    runtime: python
    plan: free
    branch: interview-demo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEMO_MODE
        value: "1"
